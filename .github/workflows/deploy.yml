name: Deploy (manual)

# Deploys only from a green CI run of the selected ref. Secrets live exclusively in GitHub
# environment secrets and OpenTofu variables – never in the repository.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, per_page: 50,
            });
            const ci = data.workflow_runs.filter(r => r.name === 'CI');
            if (!ci.some(r => r.conclusion === 'success')) {
              core.setFailed(`No successful CI run for ${context.sha}`);
            }

  build-push:
    name: Build and push image
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - id: meta
        run: echo "image=${{ vars.SCW_REGISTRY }}/${{ vars.SCW_NAMESPACE }}/bibby:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: GIT_SHA=${{ github.sha }}

  migrate:
    name: Run database migrations (separate step, never at container start)
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - run: uv sync --frozen --no-dev
      - name: alembic upgrade head
        env:
          BIBBY_DATABASE_URL: ${{ secrets.BIBBY_DATABASE_URL_MIGRATIONS }}
          BIBBY_APP_SECRET: ${{ secrets.BIBBY_APP_SECRET }}
        run: uv run alembic upgrade head

  deploy:
    name: Apply infrastructure (OpenTofu)
    needs: [build-push, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_container_image: ${{ needs.build-push.outputs.image }}
      TF_VAR_app_secret: ${{ secrets.BIBBY_APP_SECRET }}
      TF_VAR_field_encryption_key: ${{ secrets.BIBBY_FIELD_ENCRYPTION_KEY }}
      TF_VAR_database_url: ${{ secrets.BIBBY_DATABASE_URL }}
      TF_VAR_mail_api_key: ${{ secrets.BIBBY_MAIL_API_KEY }}
      TF_VAR_mail_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_public_base_url: ${{ vars.PUBLIC_BASE_URL }}
      TF_VAR_environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.5"
      - run: tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=bibby/${{ inputs.environment }}.tfstate"
      - run: tofu plan -input=false -out=tfplan
      - run: tofu apply -input=false tfplan
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.PUBLIC_BASE_URL }}/health"
          curl -fsS "${{ vars.PUBLIC_BASE_URL }}/version"
